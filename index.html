<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>朝のニュース見出し</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#1d1d1f;--sub:#6b6b70;--ac:#b4402b;--bd:#e7e2d9;--chip:#f1ece3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#212121;--tx:#f2f0eb;--sub:#a3a3a8;--ac:#e8806b;--bd:#333;--chip:#2c2c2c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0}
.date{color:var(--sub);font-size:13px;margin:2px 0 14px}
.lead{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.lead b{display:block;font-size:12px;color:var(--ac);margin-bottom:2px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--chip);color:var(--tx);border-radius:999px;padding:6px 14px;font-size:13px;font-family:inherit}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h2{font-size:15px;margin:0 0 4px;line-height:1.5}
.card p{font-size:14px;margin:0;color:var(--sub)}
.meta{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:11px;color:var(--sub)}
.tag{background:var(--chip);border-radius:4px;padding:1px 7px}
.meta a{color:var(--ac);margin-left:auto;text-decoration:none}
footer{font-size:11px;color:var(--sub);margin-top:18px}
</style>
</head>
<body>
<main>
<h1>📰 朝のニュース見出し</h1>
<div class="date" id="date">読み込み中…</div>
<div class="lead" id="lead" hidden><b>今日の要点</b><span id="leadt"></span></div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<footer>各社が公開しているRSSの見出しを毎朝自動で集めています。内容は各リンク先でご確認ください。</footer>
</main>
<script>
var N=[],cur="すべて";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
var cats=["すべて"];
var srcs=N.map(function(n){return n.source}).filter(function(c,i,a){return a.indexOf(c)===i});
document.getElementById("tabs").innerHTML=cats.concat(srcs).map(function(c){return '<button class="'+(c===cur?"on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("");
document.getElementById("list").innerHTML=N.filter(function(n){return cur==="すべて"||n.category===cur||n.source===cur}).map(function(n){
return '<div class="card"><h2>'+esc(n.title)+'</h2>'+(n.summary?'<p>'+esc(n.summary)+'</p>':'')+'<div class="meta"><span class="tag">'+esc(n.source)+'</span><a href="'+esc(n.link)+'" target="_blank" rel="noopener">元記事 ›</a></div></div>'}).join("");
}
document.getElementById("tabs").addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(c){cur=c;render()}});
fetch("news.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
document.getElementById("date").textContent=d.date;
if(d.lead){document.getElementById("lead").hidden=false;document.getElementById("leadt").textContent=d.lead}
N=d.items;render();
}).catch(function(){document.getElementById("date").textContent="ニュースを読み込めませんでした"});
</script>
</body>
</html>
